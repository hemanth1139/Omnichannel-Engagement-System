<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HCP Directory | HCP Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- MediElite Top Navigation -->
<header class="medielite-navbar">
  <div class="nav-container">
    <div class="brand">
      <img src="logo.png" alt="OES Logo" class="brand-logo" />
      <div class="brand-text">
        <h2>Omnichannel Engagement System</h2>
      </div>
    </div>
    
    <nav class="top-nav" id="sidebarNav">
      <a href="index.html">Home</a>
      <a href="index.html#overview">Overview</a>
      <a href="index.html#engagement">Engagement</a>
      <a href="index.html#channels">Channels</a>
      <a class="active" href="directory.html">Directory</a>
    </nav>
    
    <div class="nav-actions">
      <button class="pill-btn cyan" id="refreshDirectoryBtn">Refresh</button>
      <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Toggle Menu">☰</button>
    </div>
  </div>
</header>

<main class="main-content">
  <!-- Large Search Bar Component -->
  <div class="search-container" style="margin-top: 40px;">
    <div class="search-wrap-large">
      <span class="search-icon">⌕</span>
      <input id="hcpSearch" placeholder="Search HCP by name or HCP ID..." autocomplete="off">
      <div id="searchResults" class="search-results"></div>
    </div>
  </div>

  <section class="hero" id="overview">
    <div style="text-align: center; margin-bottom: 40px;">
      <h1 style="font-size: 42px;">HCP Directory</h1>
      <p style="margin: 0 auto; max-width: 600px;">Browse all registered healthcare professionals, view their core details, and access full predictive engagement profiles.</p>
    </div>
  </section>

  <section id="directoryErrorBox" class="error hidden">Unable to load data. <button onclick="loadDirectory()">Retry</button></section>

  <section class="directory-container">
    <div class="directory-grid" id="directoryGrid">
      <!-- Cards will be dynamically injected here -->
    </div>
    <div style="text-align: center; margin: 40px 0;">
      <button id="loadMoreBtn" class="pill-btn dark hidden" onclick="loadMore()">Load More HCPs <span class="arrow-circle">↓</span></button>
    </div>
  </section>

</main>
<script src="script.js"></script>
<script src="directory.js"></script>
</body>
</html>
