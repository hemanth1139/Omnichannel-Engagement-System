<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HCP Directory | HCP Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- MediElite Top Navigation -->
<header class="medielite-navbar">
  <div class="nav-container">
    <div class="brand">
      <img src="logo.png" alt="OES Logo" class="brand-logo" />
      <div class="brand-text">
        <h2>Omnichannel Engagement System</h2>
      </div>
    </div>
    
    <nav class="top-nav" id="sidebarNav">
      <a href="index.html">Home</a>
      <a href="index.html#overview">Overview</a>
      <a href="index.html#engagement">Engagement</a>
      <a href="index.html#channels">Channels</a>
      <a class="active" href="directory.html">Directory</a>
    </nav>
    
    <div class="nav-actions">
      <button id="refreshDirectoryBtn" class="refresh-btn" title="Refresh Data" aria-label="Refresh">
        <span class="refresh-live-dot"></span>
        <svg class="refresh-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 4v6h-6"/>
          <path d="M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
        </svg>
      </button>
      <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="Toggle Menu">☰</button>
    </div>
  </div>
</header>

<main class="main-content">

  <!-- Directory Header: Title left, Search right -->
  <div class="dir-header-block">

    <!-- Top row: title left, search right -->
    <div class="dir-top-row">
      <div class="dir-title-row">
        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 6px;">
          <h1 class="dir-title" style="margin-bottom: 0;">HCP Directory</h1>
          <a id="exportPdfBtn" download class="pill-btn cyan" style="padding: 4px 12px; font-size: 13px; cursor: pointer;">
            Export PDF <span class="arrow-circle" style="width: 20px; height: 20px; font-size: 12px; background: rgba(255,255,255,0.2);">↓</span>
          </a>
        </div>
        <p class="dir-subtitle">Browse all registered healthcare professionals and access full predictive engagement profiles.</p>
      </div>
      <div class="search-wrap-large dir-search">
        <span class="search-icon">⌕</span>
        <input id="hcpSearch" placeholder="Search HCP by name or HCP ID..." autocomplete="off">
        <div id="searchResults" class="search-results"></div>
      </div>
    </div>

    <!-- Filters: full-width row below -->
    <div class="filter-bar">
      <div class="filter-group">
        <span class="filter-label">Next Best Channel</span>
        <div class="filter-chips" id="nbcFilters">
          <button class="chip active" data-nbc="all">All</button>
          <button class="chip" data-nbc="Email">Email</button>
          <button class="chip" data-nbc="Website">Website</button>
          <button class="chip" data-nbc="Webinar">Webinar</button>
          <button class="chip" data-nbc="Sales_Rep">Sales Rep</button>
        </div>
      </div>
      <div class="filter-divider"></div>
      <div class="filter-group">
        <span class="filter-label">Engagement Level</span>
        <div class="filter-chips" id="levelFilters">
          <button class="chip active" data-level="all">All</button>
          <button class="chip chip-high" data-level="High">High</button>
          <button class="chip chip-medium" data-level="Medium">Medium</button>
          <button class="chip chip-low" data-level="Low">Low</button>
        </div>
      </div>
      <span class="filter-results-count" id="filterCount"></span>
    </div>

  </div>

  <section id="directoryErrorBox" class="error hidden">Unable to load data. <button onclick="loadDirectory()">Retry</button></section>

  <section class="directory-container">
    <div class="directory-grid" id="directoryGrid"></div>
    <div style="text-align: center; margin: 40px 0;">
      <button id="loadMoreBtn" class="pill-btn dark hidden" onclick="loadMore()">Load More HCPs <span class="arrow-circle">↓</span></button>
    </div>
  </section>

</main>
<script src="script.js"></script>
<script src="directory.js"></script>
</body>
</html>
